<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - AiniFlow</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* WhatsApp-style contact list */
        .contact-item {
            transition: all 0.2s;
        }
        
        .contact-item:active {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-50" x-data="contactsApp()">
    
    <!-- Top Navigation -->
    <nav class="bg-purple-600 text-white sticky top-0 z-50 shadow-lg">
        <div class="px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <a href="/dashboard.html" class="text-white">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <h1 class="text-xl font-bold">Contacts</h1>
                </div>
                <button @click="showInviteModal = true" class="px-3 py-1 bg-white/20 rounded-lg text-sm">
                    <i class="fas fa-user-plus mr-1"></i>
                    Invite
                </button>
            </div>
            
            <!-- Search Bar -->
            <div class="mt-3 relative">
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-purple-300"></i>
                <input 
                    type="text" 
                    x-model="searchQuery"
                    @input="filterContacts()"
                    placeholder="Search contacts..."
                    class="w-full pl-10 pr-4 py-2 rounded-lg bg-purple-500 text-white placeholder-purple-200 focus:outline-none focus:bg-purple-400"
                >
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="pb-20">
        
        <!-- On AiniFlow Section -->
        <div class="bg-white mt-2">
            <div class="px-4 py-2 bg-gray-100 border-b border-gray-200">
                <p class="text-xs font-semibold text-gray-600 uppercase">On AiniFlow</p>
            </div>
            
            <div x-show="loading" class="px-4 py-8 text-center">
                <i class="fas fa-spinner fa-spin text-2xl text-purple-600"></i>
            </div>
            
            <div x-show="!loading && filteredOnAiniFlow.length === 0" class="px-4 py-8 text-center">
                <i class="fas fa-users text-4xl text-gray-300 mb-2"></i>
                <p class="text-gray-500 text-sm">No contacts on AiniFlow yet</p>
                <button @click="showInviteModal = true" class="mt-3 px-4 py-2 bg-purple-600 text-white rounded-lg text-sm">
                    Invite Friends
                </button>
            </div>
            
            <template x-for="contact in filteredOnAiniFlow" :key="contact.phone">
                <div class="contact-item px-4 py-3 border-b border-gray-100 flex items-center justify-between" @click="openChat(contact)">
                    <div class="flex items-center space-x-3 flex-1">
                        <div class="relative">
                            <div class="w-12 h-12 rounded-full bg-purple-600 flex items-center justify-center text-white font-semibold text-lg">
                                <span x-text="contact.name.charAt(0).toUpperCase()"></span>
                            </div>
                            <div x-show="contact.is_online" class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-semibold text-gray-800 truncate" x-text="contact.name"></p>
                            <p class="text-sm text-gray-500 truncate" x-text="contact.bio || 'Hey there! I am using AiniFlow'"></p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button @click.stop="startCall(contact)" class="w-9 h-9 bg-purple-100 rounded-full flex items-center justify-center text-purple-600 hover:bg-purple-200">
                            <i class="fas fa-phone text-sm"></i>
                        </button>
                        <button @click.stop="startVideoCall(contact)" class="w-9 h-9 bg-purple-100 rounded-full flex items-center justify-center text-purple-600 hover:bg-purple-200">
                            <i class="fas fa-video text-sm"></i>
                        </button>
                    </div>
                </div>
            </template>
        </div>
        
        <!-- Invite to AiniFlow Section -->
        <div class="bg-white mt-4" x-show="filteredNotOnAiniFlow.length > 0">
            <div class="px-4 py-2 bg-gray-100 border-b border-gray-200">
                <p class="text-xs font-semibold text-gray-600 uppercase">Invite to AiniFlow</p>
            </div>
            
            <template x-for="contact in filteredNotOnAiniFlow" :key="contact.phone">
                <div class="contact-item px-4 py-3 border-b border-gray-100 flex items-center justify-between">
                    <div class="flex items-center space-x-3 flex-1">
                        <div class="w-12 h-12 rounded-full bg-gray-300 flex items-center justify-center text-gray-600 font-semibold text-lg">
                            <span x-text="contact.name.charAt(0).toUpperCase()"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-semibold text-gray-800 truncate" x-text="contact.name"></p>
                            <p class="text-sm text-gray-500 truncate" x-text="contact.phone"></p>
                        </div>
                    </div>
                    <button @click="inviteContact(contact)" class="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm hover:bg-purple-700">
                        <i class="fas fa-paper-plane mr-1"></i>
                        Invite
                    </button>
                </div>
            </template>
        </div>
        
    </div>
    
    <!-- Floating Action Button -->
    <button @click="requestContactPermission()" class="fixed bottom-20 right-4 w-14 h-14 bg-purple-600 rounded-full shadow-lg flex items-center justify-center text-white hover:bg-purple-700">
        <i class="fas fa-sync-alt text-xl"></i>
    </button>
    
    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg">
        <div class="flex justify-around py-2">
            <a href="/dashboard.html" class="flex flex-col items-center py-2 px-4 text-gray-600">
                <i class="fas fa-home text-xl mb-1"></i>
                <span class="text-xs">Home</span>
            </a>
            <a href="/contacts.html" class="flex flex-col items-center py-2 px-4 text-purple-600">
                <i class="fas fa-users text-xl mb-1"></i>
                <span class="text-xs font-semibold">Contacts</span>
            </a>
            <a href="/wallet.html" class="flex flex-col items-center py-2 px-4 text-gray-600">
                <i class="fas fa-wallet text-xl mb-1"></i>
                <span class="text-xs">Wallet</span>
            </a>
            <a href="/profile.html" class="flex flex-col items-center py-2 px-4 text-gray-600">
                <i class="fas fa-user text-xl mb-1"></i>
                <span class="text-xs">Profile</span>
            </a>
        </div>
    </nav>
    
    <!-- Invite Modal -->
    <div x-show="showInviteModal" 
         x-transition
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
         @click.self="showInviteModal = false">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Invite Friends</h3>
                <button @click="showInviteModal = false" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <!-- Share Link -->
                <div class="p-4 bg-purple-50 rounded-lg border border-purple-200">
                    <p class="text-sm font-semibold text-purple-900 mb-2">Your Invite Link</p>
                    <div class="flex items-center space-x-2">
                        <input 
                            type="text" 
                            :value="inviteLink"
                            readonly
                            class="flex-1 px-3 py-2 bg-white border border-purple-300 rounded text-sm"
                        >
                        <button @click="copyInviteLink()" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700 text-sm">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Share via SMS -->
                <button @click="shareViaSMS()" class="w-full px-4 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 flex items-center justify-center">
                    <i class="fas fa-comment-dots mr-2"></i>
                    Share via SMS
                </button>
                
                <!-- Share via WhatsApp -->
                <button @click="shareViaWhatsApp()" class="w-full px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center justify-center">
                    <i class="fab fa-whatsapp mr-2 text-xl"></i>
                    Share via WhatsApp
                </button>
                
                <!-- Enter Phone Manually -->
                <div class="border-t pt-4 mt-4">
                    <p class="text-sm font-semibold text-gray-700 mb-2">Send to specific number</p>
                    <div class="flex space-x-2">
                        <input 
                            type="tel" 
                            x-model="manualPhone"
                            placeholder="+1 305 555 1234"
                            class="flex-1 px-3 py-2 border border-gray-300 rounded"
                        >
                        <button @click="sendInvite(manualPhone)" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">
                            Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function contactsApp() {
            return {
                user: {},
                onAiniFlow: [],
                notOnAiniFlow: [],
                filteredOnAiniFlow: [],
                filteredNotOnAiniFlow: [],
                searchQuery: '',
                loading: true,
                showInviteModal: false,
                manualPhone: '',
                inviteLink: '',
                
                apiUrl: window.location.origin + '/api',
                
                init() {
                    // Load user from localStorage
                    const userData = localStorage.getItem('ainiflow_user');
                    if (userData) {
                        this.user = JSON.parse(userData);
                        this.inviteLink = `${window.location.origin}/?invite=${this.user.phone}`;
                    } else {
                        window.location.href = '/login.html';
                        return;
                    }
                    
                    // Request contact permission and sync
                    this.requestContactPermission();
                },
                
                async requestContactPermission() {
                    this.loading = true;
                    
                    // Check if Contact Picker API is available (modern browsers)
                    if ('contacts' in navigator && 'ContactsManager' in window) {
                        try {
                            const contacts = await navigator.contacts.select(
                                ['name', 'tel'], 
                                { multiple: true }
                            );
                            
                            await this.syncContacts(contacts);
                        } catch (error) {
                            console.log('Contact access denied or not supported:', error);
                            // Fallback: Load demo contacts
                            this.loadDemoContacts();
                        }
                    } else {
                        // Browser doesn't support Contact Picker API
                        // Show manual import option
                        this.loadDemoContacts();
                    }
                    
                    this.loading = false;
                },
                
                async syncContacts(contacts) {
                    // Extract phone numbers
                    const phoneNumbers = contacts
                        .filter(c => c.tel && c.tel.length > 0)
                        .map(c => ({
                            name: c.name || c.tel[0],
                            phone: c.tel[0]
                        }));
                    
                    // Check which contacts are on AiniFlow
                    try {
                        const response = await fetch(`${this.apiUrl}/users/check-contacts`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                phone_numbers: phoneNumbers.map(c => c.phone),
                                requester: this.user.phone
                            })
                        });
                        
                        if (response.ok) {
                            const result = await response.json();
                            this.onAiniFlow = result.on_ainiflow || [];
                            this.notOnAiniFlow = result.not_on_ainiflow || [];
                            this.filteredOnAiniFlow = this.onAiniFlow;
                            this.filteredNotOnAiniFlow = this.notOnAiniFlow;
                        }
                    } catch (error) {
                        console.error('Error syncing contacts:', error);
                    }
                },
                
                loadDemoContacts() {
                    // Demo data for testing (when contact permission denied)
                    this.onAiniFlow = [
                        { phone: '+1234567890', name: 'Test User', bio: 'Developer account', is_online: true },
                    ];
                    
                    this.notOnAiniFlow = [
                        { phone: '+1234567891', name: 'Mom', bio: null },
                        { phone: '+1234567892', name: 'Dad', bio: null },
                        { phone: '+1234567893', name: 'Brother', bio: null },
                    ];
                    
                    this.filteredOnAiniFlow = this.onAiniFlow;
                    this.filteredNotOnAiniFlow = this.notOnAiniFlow;
                },
                
                filterContacts() {
                    const query = this.searchQuery.toLowerCase();
                    
                    if (!query) {
                        this.filteredOnAiniFlow = this.onAiniFlow;
                        this.filteredNotOnAiniFlow = this.notOnAiniFlow;
                        return;
                    }
                    
                    this.filteredOnAiniFlow = this.onAiniFlow.filter(c => 
                        c.name.toLowerCase().includes(query) || 
                        c.phone.includes(query)
                    );
                    
                    this.filteredNotOnAiniFlow = this.notOnAiniFlow.filter(c => 
                        c.name.toLowerCase().includes(query) || 
                        c.phone.includes(query)
                    );
                },
                
                openChat(contact) {
                    // Save selected contact and open chat
                    localStorage.setItem('ainiflow_chat_contact', JSON.stringify(contact));
                    window.location.href = '/chat.html';
                },
                
                startCall(contact) {
                    alert(`Voice call to ${contact.name} - Coming soon!`);
                },
                
                startVideoCall(contact) {
                    alert(`Video call to ${contact.name} - Coming soon!`);
                },
                
                inviteContact(contact) {
                    this.sendInvite(contact.phone);
                },
                
                sendInvite(phone) {
                    const message = `Hey! Join me on AiniFlow - the best travel social network! ${this.inviteLink}`;
                    
                    // Try to open SMS app
                    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                        window.location.href = `sms:${phone}?body=${encodeURIComponent(message)}`;
                    } else {
                        this.copyInviteLink();
                        alert('Invite link copied! Share it with your friend.');
                    }
                    
                    this.showInviteModal = false;
                },
                
                copyInviteLink() {
                    navigator.clipboard.writeText(this.inviteLink);
                    alert('Invite link copied to clipboard!');
                },
                
                shareViaSMS() {
                    const message = `Hey! Join me on AiniFlow - the best travel social network! ${this.inviteLink}`;
                    window.location.href = `sms:?body=${encodeURIComponent(message)}`;
                },
                
                shareViaWhatsApp() {
                    const message = `Hey! Join me on *AiniFlow* - the best travel social network! ${this.inviteLink}`;
                    window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
                }
            }
        }
    </script>
    
</body>
</html>
