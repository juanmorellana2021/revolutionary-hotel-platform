<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Test AI System - Multi-Hotel PMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-2">🤖 Sistema AI - Test de Rendimiento</h1>
        <p class="text-gray-400 mb-8">Verifica optimizaciones y respuestas del AI</p>
        
        <!-- Test 1: Ollama Connection -->
        <div class="bg-gray-800 rounded-lg p-6 mb-4 border border-gray-700">
            <h2 class="text-xl font-bold mb-4">1️⃣ Conexión al Servidor Ollama</h2>
            <button onclick="testOllama()" class="bg-indigo-600 px-4 py-2 rounded hover:bg-indigo-700 transition">
                🔍 Test Conexión
            </button>
            <div id="ollamaResult" class="mt-4 text-sm"></div>
        </div>
        
        <!-- Test 2: Cache Performance -->
        <div class="bg-gray-800 rounded-lg p-6 mb-4 border border-gray-700">
            <h2 class="text-xl font-bold mb-4">2️⃣ Performance de Cache</h2>
            <button onclick="testCache()" class="bg-green-600 px-4 py-2 rounded hover:bg-green-700 transition">
                ⚡ Test Cache
            </button>
            <div id="cacheResult" class="mt-4 text-sm"></div>
        </div>
        
        <!-- Test 3: AI Queries -->
        <div class="bg-gray-800 rounded-lg p-6 mb-4 border border-gray-700">
            <h2 class="text-xl font-bold mb-4">3️⃣ Pruebas de Queries AI</h2>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="testQuery('habitaciones disponibles')" class="bg-blue-600 px-3 py-2 rounded text-sm hover:bg-blue-700">
                    Query Simple
                </button>
                <button onclick="testQuery('suites disponibles bajo $150')" class="bg-purple-600 px-3 py-2 rounded text-sm hover:bg-purple-700">
                    Query Compleja
                </button>
                <button onclick="testQuery('cuántas habitaciones ocupadas')" class="bg-orange-600 px-3 py-2 rounded text-sm hover:bg-orange-700">
                    Estadística
                </button>
                <button onclick="testQuery('show me available rooms')" class="bg-pink-600 px-3 py-2 rounded text-sm hover:bg-pink-700">
                    Inglés
                </button>
            </div>
            <div id="queryResult" class="mt-4 text-sm"></div>
        </div>
        
        <!-- Test 4: Custom Query -->
        <div class="bg-gray-800 rounded-lg p-6 mb-4 border border-gray-700">
            <h2 class="text-xl font-bold mb-4">4️⃣ Query Personalizada</h2>
            <input type="text" id="customQuery" placeholder="Escribe tu pregunta aquí..." 
                   class="w-full bg-gray-700 px-4 py-2 rounded border border-gray-600 mb-2">
            <button onclick="testCustomQuery()" class="bg-indigo-600 px-4 py-2 rounded hover:bg-indigo-700 transition">
                🚀 Enviar
            </button>
            <div id="customResult" class="mt-4 text-sm"></div>
        </div>
        
        <!-- Results Summary -->
        <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
            <h2 class="text-xl font-bold mb-4">📊 Resumen de Performance</h2>
            <div id="summary" class="space-y-2 text-sm">
                <p class="text-gray-400">Ejecuta los tests para ver resultados...</p>
            </div>
        </div>
    </div>
    
    <script>
        let testResults = {
            totalTests: 0,
            passed: 0,
            failed: 0,
            avgResponseTime: 0,
            cacheHits: 0
        };
        
        async function testOllama() {
            const resultDiv = document.getElementById('ollamaResult');
            resultDiv.innerHTML = '<p class="text-yellow-400">⏳ Conectando a Ollama...</p>';
            
            const startTime = Date.now();
            
            try {
                const response = await fetch('http://72.60.1.16:11434/api/tags');
                const data = await response.json();
                const responseTime = Date.now() - startTime;
                
                resultDiv.innerHTML = `
                    <p class="text-green-400">✅ Conectado exitosamente (${responseTime}ms)</p>
                    <p class="text-gray-400 mt-2">Modelos disponibles:</p>
                    <ul class="list-disc list-inside text-gray-300 mt-1">
                        ${data.models.map(m => `<li>${m.name} - ${(m.size / 1024 / 1024 / 1024).toFixed(2)} GB</li>`).join('')}
                    </ul>
                `;
                testResults.passed++;
            } catch (error) {
                resultDiv.innerHTML = `<p class="text-red-400">❌ Error: ${error.message}</p>`;
                testResults.failed++;
            }
            testResults.totalTests++;
            updateSummary();
        }
        
        async function testCache() {
            const resultDiv = document.getElementById('cacheResult');
            resultDiv.innerHTML = '<p class="text-yellow-400">⏳ Probando cache...</p>';
            
            const queries = ['habitaciones disponibles', 'habitaciones disponibles', 'habitaciones disponibles'];
            const times = [];
            
            for (let i = 0; i < queries.length; i++) {
                const startTime = Date.now();
                await fetch('ai_room_query.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'query=' + encodeURIComponent(queries[i])
                });
                times.push(Date.now() - startTime);
            }
            
            resultDiv.innerHTML = `
                <p class="text-green-400">✅ Test completado</p>
                <p class="text-gray-300 mt-2">1ra request: ${times[0]}ms (sin cache)</p>
                <p class="text-gray-300">2da request: ${times[1]}ms (con cache)</p>
                <p class="text-gray-300">3ra request: ${times[2]}ms (con cache)</p>
                <p class="text-indigo-400 mt-2 font-bold">
                    Mejora: ${((times[0] - times[1]) / times[0] * 100).toFixed(1)}% más rápido con cache
                </p>
            `;
            
            testResults.cacheHits += 2;
            testResults.passed++;
            testResults.totalTests++;
            updateSummary();
        }
        
        async function testQuery(query) {
            const resultDiv = document.getElementById('queryResult');
            resultDiv.innerHTML = `<p class="text-yellow-400">⏳ Procesando: "${query}"...</p>`;
            
            const startTime = Date.now();
            
            try {
                const response = await fetch('ai_room_query.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'query=' + encodeURIComponent(query)
                });
                
                const data = await response.json();
                const responseTime = Date.now() - startTime;
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <p class="text-green-400">✅ Respuesta en ${responseTime}ms</p>
                        <p class="text-indigo-300 mt-2 font-semibold">"${data.response}"</p>
                        <div class="mt-2 text-gray-400">
                            <p>📊 ${data.filtered_count} de ${data.total_rooms} habitaciones</p>
                            <p>🤖 Modelo: ${data.model_used || 'auto'}</p>
                            <p>⚡ Cache: ${data.from_cache ? 'HIT' : 'MISS'}</p>
                        </div>
                    `;
                    testResults.passed++;
                    testResults.avgResponseTime = ((testResults.avgResponseTime * (testResults.totalTests) + responseTime) / (testResults.totalTests + 1));
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="text-red-400">❌ Error: ${error.message}</p>`;
                testResults.failed++;
            }
            
            testResults.totalTests++;
            updateSummary();
        }
        
        async function testCustomQuery() {
            const query = document.getElementById('customQuery').value;
            if (!query) return;
            
            const resultDiv = document.getElementById('customResult');
            resultDiv.innerHTML = `<p class="text-yellow-400">⏳ Procesando: "${query}"...</p>`;
            
            const startTime = Date.now();
            
            try {
                const response = await fetch('ai_room_query.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'query=' + encodeURIComponent(query)
                });
                
                const data = await response.json();
                const responseTime = Date.now() - startTime;
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <p class="text-green-400">✅ Respuesta en ${responseTime}ms</p>
                        <div class="bg-gray-900 p-4 rounded mt-2 border border-indigo-500">
                            <p class="text-indigo-300 font-semibold mb-2">🤖 AI Respuesta:</p>
                            <p class="text-white">"${data.response}"</p>
                        </div>
                        <div class="mt-3 grid grid-cols-3 gap-2 text-center">
                            <div class="bg-gray-900 p-2 rounded">
                                <p class="text-gray-400 text-xs">Habitaciones</p>
                                <p class="text-xl font-bold text-indigo-400">${data.filtered_count}</p>
                            </div>
                            <div class="bg-gray-900 p-2 rounded">
                                <p class="text-gray-400 text-xs">Tiempo</p>
                                <p class="text-xl font-bold text-green-400">${responseTime}ms</p>
                            </div>
                            <div class="bg-gray-900 p-2 rounded">
                                <p class="text-gray-400 text-xs">Modelo</p>
                                <p class="text-xl font-bold text-purple-400">${data.model_used || 'auto'}</p>
                            </div>
                        </div>
                    `;
                    testResults.passed++;
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="text-red-400">❌ Error: ${error.message}</p>`;
                testResults.failed++;
            }
            
            testResults.totalTests++;
            updateSummary();
        }
        
        function updateSummary() {
            const summaryDiv = document.getElementById('summary');
            const successRate = testResults.totalTests > 0 ? (testResults.passed / testResults.totalTests * 100).toFixed(1) : 0;
            
            summaryDiv.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-gray-400">Total Tests:</p>
                        <p class="text-2xl font-bold text-white">${testResults.totalTests}</p>
                    </div>
                    <div>
                        <p class="text-gray-400">Tasa de Éxito:</p>
                        <p class="text-2xl font-bold text-green-400">${successRate}%</p>
                    </div>
                    <div>
                        <p class="text-gray-400">Tiempo Promedio:</p>
                        <p class="text-2xl font-bold text-indigo-400">${testResults.avgResponseTime.toFixed(0)}ms</p>
                    </div>
                    <div>
                        <p class="text-gray-400">Cache Hits:</p>
                        <p class="text-2xl font-bold text-purple-400">${testResults.cacheHits}</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
