<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiniFlow - Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .mobile-hide {
                display: none;
            }
            .stat-card {
                padding: 1rem !important;
            }
            .stat-card h3 {
                font-size: 0.875rem !important;
            }
            .stat-card .stat-number {
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50" x-data="dashboardApp()">
    
    <!-- Top Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-14 sm:h-16">
                <!-- Logo -->
                <div class="flex items-center">
                    <i class="fas fa-comments text-xl sm:text-2xl text-purple-600 mr-2"></i>
                    <span class="text-lg sm:text-xl font-bold text-gray-800">AiniFlow</span>
                </div>
                
                <!-- User Menu -->
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <button class="text-gray-600 hover:text-purple-600 mobile-hide">
                        <i class="fas fa-bell text-xl"></i>
                    </button>
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-purple-600 flex items-center justify-center text-white font-semibold text-sm sm:text-base">
                            <span x-text="user.name ? user.name.charAt(0).toUpperCase() : 'U'"></span>
                        </div>
                        <span class="text-xs sm:text-sm font-medium text-gray-700 mobile-hide" x-text="user.name"></span>
                    </div>
                    <button @click="logout" class="text-gray-600 hover:text-red-600">
                        <i class="fas fa-sign-out-alt text-sm sm:text-base"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8">
        
        <!-- Welcome Section -->
        <div class="mb-4 sm:mb-8">
            <h1 class="text-xl sm:text-3xl font-bold text-gray-800 mb-1 sm:mb-2">
                Welcome, <span x-text="user.name"></span>! 👋
            </h1>
            <p class="text-sm sm:text-base text-gray-600">Connect with travelers worldwide</p>
        </div>
        
        <!-- Stats Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-6 mb-4 sm:mb-8">
            <!-- Messages -->
            <div class="bg-white rounded-lg shadow p-4 sm:p-6 stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs sm:text-sm text-gray-600 mb-1">Messages</p>
                        <p class="text-xl sm:text-2xl font-bold text-gray-800 stat-number">12</p>
                    </div>
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-envelope text-blue-600 text-base sm:text-xl"></i>
                    </div>
                </div>
            </div>
            
            <!-- Chatrooms -->
            <div class="bg-white rounded-lg shadow p-4 sm:p-6 stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs sm:text-sm text-gray-600 mb-1">Rooms</p>
                        <p class="text-xl sm:text-2xl font-bold text-gray-800 stat-number" x-text="chatrooms.length"></p>
                    </div>
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-users text-purple-600 text-base sm:text-xl"></i>
                    </div>
                </div>
            </div>
            
            <!-- Reputation -->
            <div class="bg-white rounded-lg shadow p-4 sm:p-6 stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs sm:text-sm text-gray-600 mb-1">Rating</p>
                        <p class="text-xl sm:text-2xl font-bold text-gray-800 stat-number">
                            <span x-text="user.average_rating || '0.0'"></span>
                            <i class="fas fa-star text-yellow-400 text-sm sm:text-lg ml-1"></i>
                        </p>
                    </div>
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-award text-yellow-600 text-base sm:text-xl"></i>
                    </div>
                </div>
            </div>
            
            <!-- Wallet -->
            <div class="bg-white rounded-lg shadow p-4 sm:p-6 stat-card cursor-pointer hover:shadow-lg transition" @click="window.location.href='/wallet.html'">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs sm:text-sm text-gray-600 mb-1">Wallet</p>
                        <p class="text-xl sm:text-2xl font-bold text-gray-800 stat-number">
                            <span x-text="user.wallet_balance || '0'"></span> AC
                        </p>
                    </div>
                    <div class="w-10 h-10 sm:w-12 sm:h-12 bg-green-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-wallet text-green-600 text-base sm:text-xl"></i>
                    </div>
                </div>
            </div>
        </div>        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-8">
            
            <!-- Left Column - Chatrooms (Full width on mobile) -->
            <div class="lg:col-span-2 order-1">
                <div class="bg-white rounded-lg shadow">
                    <div class="p-4 sm:p-6 border-b border-gray-200">
                        <h2 class="text-lg sm:text-xl font-bold text-gray-800">Discover Chatrooms</h2>
                        <p class="text-xs sm:text-sm text-gray-600 mt-1">Join conversations worldwide</p>
                        
                        <!-- Search and Filters -->
                        <div class="mt-3 sm:mt-4 space-y-2 sm:space-y-3">
                            <!-- Search Bar -->
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                    <i class="fas fa-search text-gray-400 text-sm"></i>
                                </div>
                                <input 
                                    type="text" 
                                    x-model="searchQuery"
                                    @input="filterChatrooms"
                                    placeholder="Search chatrooms..."
                                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                >
                            </div>
                            
                            <!-- Filter Buttons -->
                            <div class="flex gap-2 flex-wrap">
                                <button 
                                    @click="filterType = 'all'; filterChatrooms()"
                                    :class="filterType === 'all' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-700'"
                                    class="px-4 py-2 rounded-lg text-sm font-medium hover:opacity-90 transition"
                                >
                                    <i class="fas fa-globe mr-1"></i> All
                                </button>
                                <button 
                                    @click="filterType = 'location'; filterChatrooms()"
                                    :class="filterType === 'location' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700'"
                                    class="px-4 py-2 rounded-lg text-sm font-medium hover:opacity-90 transition"
                                >
                                    <i class="fas fa-map-marker-alt mr-1"></i> Locations
                                </button>
                                <button 
                                    @click="filterType = 'topic'; filterChatrooms()"
                                    :class="filterType === 'topic' ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-700'"
                                    class="px-4 py-2 rounded-lg text-sm font-medium hover:opacity-90 transition"
                                >
                                    <i class="fas fa-hashtag mr-1"></i> Topics
                                </button>
                            </div>
                            
                            <!-- Results Count -->
                            <p class="text-sm text-gray-600">
                                <span x-text="filteredChatrooms.length"></span> chatroom<span x-show="filteredChatrooms.length !== 1">s</span> found
                            </p>
                        </div>
                    </div>
                    
                    <div class="p-6">
                        <div class="space-y-4">
                            <template x-for="room in filteredChatrooms" :key="room.id">
                                <div class="border border-gray-200 rounded-lg p-4 hover:border-purple-300 transition cursor-pointer" @click="joinChatroom(room.id)">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-4">
                                            <div class="w-12 h-12 bg-gradient-to-br from-purple-400 to-purple-600 rounded-lg flex items-center justify-center text-white text-xl">
                                                <i class="fas fa-hashtag"></i>
                                            </div>
                                            <div>
                                                <h3 class="font-semibold text-gray-800" x-text="room.name"></h3>
                                                <p class="text-sm text-gray-600" x-text="room.description"></p>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-sm font-medium text-purple-600" x-text="room.member_count + ' members'"></p>
                                            <span class="inline-block mt-1 px-2 py-1 bg-purple-100 text-purple-700 text-xs rounded-full" x-text="room.room_type"></span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            
                            <!-- Loading State -->
                            <div x-show="loading" class="text-center py-8">
                                <i class="fas fa-spinner fa-spin text-3xl text-purple-600"></i>
                                <p class="text-gray-600 mt-2">Loading chatrooms...</p>
                            </div>
                            
                            <!-- Empty State -->
                            <div x-show="!loading && filteredChatrooms.length === 0" class="text-center py-8">
                                <i class="fas fa-comments text-5xl text-gray-300 mb-4"></i>
                                <p class="text-gray-600">No chatrooms found</p>
                                <p class="text-sm text-gray-500 mt-2">Try a different search or filter</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right Column - Quick Actions & Profile -->
            <div class="space-y-6">
                
                <!-- Profile Card -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Your Profile</h3>
                    <div class="text-center">
                        <div class="w-24 h-24 bg-purple-600 rounded-full mx-auto mb-4 flex items-center justify-center text-white text-3xl font-bold">
                            <span x-text="user.name ? user.name.charAt(0).toUpperCase() : 'U'"></span>
                        </div>
                        <h4 class="font-semibold text-gray-800" x-text="user.name"></h4>
                        <p class="text-sm text-gray-600" x-text="user.phone"></p>
                        
                        <div x-show="user.bio" class="mt-4 text-sm text-gray-600" x-text="user.bio"></div>
                        
                        <!-- Badges -->
                        <div class="mt-4 flex justify-center space-x-2">
                            <span x-show="user.is_verified" class="px-3 py-1 bg-blue-100 text-blue-700 text-xs rounded-full">
                                <i class="fas fa-check-circle mr-1"></i>
                                Verified
                            </span>
                            <span x-show="user.is_superguest" class="px-3 py-1 bg-yellow-100 text-yellow-700 text-xs rounded-full">
                                <i class="fas fa-star mr-1"></i>
                                Superguest
                            </span>
                        </div>
                        
                        <button class="mt-4 w-full px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                            <i class="fas fa-edit mr-2"></i>
                            Edit Profile
                        </button>
                    </div>
                </div>
                
                <!-- Quick Actions -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Quick Actions</h3>
                    <div class="space-y-3">
                        <button class="w-full px-4 py-3 bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 text-left">
                            <i class="fas fa-paper-plane mr-2"></i>
                            New Message
                        </button>
                        <button class="w-full px-4 py-3 bg-purple-50 text-purple-700 rounded-lg hover:bg-purple-100 text-left">
                            <i class="fas fa-plus mr-2"></i>
                            Create Chatroom
                        </button>
                        <button class="w-full px-4 py-3 bg-green-50 text-green-700 rounded-lg hover:bg-green-100 text-left" @click="window.location.href='/wallet.html'">
                            <i class="fas fa-wallet mr-2"></i>
                            Add Funds
                        </button>
                        <button class="w-full px-4 py-3 bg-yellow-50 text-yellow-700 rounded-lg hover:bg-yellow-100 text-left">
                            <i class="fas fa-star mr-2"></i>
                            My Reviews
                        </button>
                    </div>
                </div>
                
            </div>
            
        </div>
        
    </div>
    
    <script>
        function dashboardApp() {
            return {
                user: {},
                chatrooms: [],
                filteredChatrooms: [],
                searchQuery: '',
                filterType: 'all', // all, location, topic
                loading: true,
                apiUrl: window.location.origin + '/api',
                
                // Location keywords for filtering
                locationKeywords: ['miami', 'new york', 'vegas', 'los angeles', 'cancun', 'playa', 'tulum', 
                                   'paris', 'barcelona', 'rome', 'london', 'tokyo', 'bangkok', 'bali'],
                
                init() {
                    // Load user from localStorage
                    const userData = localStorage.getItem('ainiflow_user');
                    if (userData) {
                        this.user = JSON.parse(userData);
                    } else {
                        // Not logged in - redirect to login
                        window.location.href = '/login.html';
                        return;
                    }
                    
                    // Load user profile from API
                    this.loadProfile();
                    
                    // Load chatrooms
                    this.loadChatrooms();
                },
                
                async loadProfile() {
                    try {
                        const response = await fetch(`${this.apiUrl}/users/${encodeURIComponent(this.user.phone)}`);
                        if (response.ok) {
                            const data = await response.json();
                            this.user = data;
                            localStorage.setItem('ainiflow_user', JSON.stringify(data));
                        }
                    } catch (error) {
                        console.error('Error loading profile:', error);
                    }
                },
                
                async loadChatrooms() {
                    this.loading = true;
                    try {
                        const response = await fetch(`${this.apiUrl}/chatrooms/public`);
                        if (response.ok) {
                            this.chatrooms = await response.json();
                            this.filterChatrooms(); // Apply initial filter
                        }
                    } catch (error) {
                        console.error('Error loading chatrooms:', error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                filterChatrooms() {
                    let results = this.chatrooms;
                    
                    // Filter by type (location vs topic)
                    if (this.filterType === 'location') {
                        results = results.filter(room => {
                            const name = room.name.toLowerCase();
                            return this.locationKeywords.some(keyword => name.includes(keyword));
                        });
                    } else if (this.filterType === 'topic') {
                        results = results.filter(room => {
                            const name = room.name.toLowerCase();
                            return !this.locationKeywords.some(keyword => name.includes(keyword));
                        });
                    }
                    
                    // Filter by search query
                    if (this.searchQuery.trim()) {
                        const query = this.searchQuery.toLowerCase();
                        results = results.filter(room => 
                            room.name.toLowerCase().includes(query) || 
                            room.description.toLowerCase().includes(query)
                        );
                    }
                    
                    this.filteredChatrooms = results;
                },
                
                joinChatroom(roomId) {
                    // Navigate to chat page
                    window.location.href = `/chat.html?room=${roomId}`;
                },
                
                logout() {
                    localStorage.removeItem('ainiflow_user');
                    localStorage.removeItem('ainiflow_token');
                    window.location.href = '/login.html';
                }
            }
        }
    </script>
    
</body>
</html>
