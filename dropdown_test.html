<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Test</title>
</head>
<body>
    <h1>Testing Dropdowns</h1>
    
    <div class="dropdown">
        <a href="#" class="dropdown-toggle">🤖 AI & WhatsApp</a>
        <div class="dropdown-content">
            <a href="ai_admin.php">🤖 AI Configuration</a>
            <a href="whatsapp_management.php">📱 WhatsApp Management</a>
        </div>
    </div>
    
    <style>
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1000;
            border-radius: 8px;
            top: 100%;
            left: 0;
            border: 1px solid #ccc;
        }
        
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }
    </style>
    
    <script>
        console.log('Script loading...');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            
            const dropdown = document.querySelector('.dropdown');
            const toggle = dropdown.querySelector('.dropdown-toggle');
            const content = dropdown.querySelector('.dropdown-content');
            
            console.log('Elements found:', {dropdown, toggle, content});
            
            toggle.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Toggle clicked!');
                
                if (content.style.display === 'block') {
                    content.style.display = 'none';
                    console.log('Hiding dropdown');
                } else {
                    content.style.display = 'block';
                    console.log('Showing dropdown');
                }
            });
        });
    </script>
</body>
</html>
